# =====================================================================
# Order Desk backend configuration
#
# Every connection setting has a local default here. Spring Boot maps
# environment variables onto these keys automatically ("relaxed binding"):
#   SPRING_DATASOURCE_URL      -> spring.datasource.url
#   SPRING_DATA_REDIS_HOST     -> spring.data.redis.host
#   APP_CORS_ALLOWED_ORIGINS   -> app.cors.allowed-origins
# so in Docker / AWS you only set env vars and never edit this file.
# =====================================================================

spring.application.name=order-desk

# --- Web server -------------------------------------------------------
server.port=8080
# Listen on all interfaces (required inside a container).
server.address=0.0.0.0
# Finish in-flight requests before stopping (e.g. on `docker stop` / ECS deploys).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- Database (MariaDB) ----------------------------------------------
spring.datasource.url=jdbc:mariadb://localhost:3306/orderdesk
spring.datasource.username=orderdesk
spring.datasource.password=orderdesk

# The schema is owned by Flyway (src/main/resources/db/migration).
# Hibernate only checks that the entities match the tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Redis (product list cache) --------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- RabbitMQ (asynchronous order processing) ------------------------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# If the listener throws, reject the message WITHOUT requeueing it,
# so RabbitMQ moves it to the dead-letter queue instead of retrying forever.
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# --- CORS (comma-separated list of allowed browser origins) ----------
app.cors.allowed-origins=http://localhost:5173

# --- Actuator --------------------------------------------------------
# Only expose /actuator/health and /actuator/info over HTTP.
management.endpoints.web.exposure.include=health,info
# Show the individual checks (db, redis, rabbit) in /actuator/health.
management.endpoint.health.show-details=always
# Enable /actuator/health/liveness and /actuator/health/readiness.
management.endpoint.health.probes.enabled=true
# Liveness  = "is the process alive?"            (restart the container if DOWN)
# Readiness = "can it serve traffic right now?"   (remove from the load balancer if DOWN)
management.endpoint.health.group.readiness.include=readinessState,db,redis,rabbit

# Values shown by /actuator/info and /api/v1/info.
# @project.version@ is replaced by Maven with the version from pom.xml at build time.
management.info.env.enabled=true
info.app.name=order-desk
info.app.version=@project.version@

# --- Orders ---------------------------------------------------------
# How long the RabbitMQ listener "works" on each order (simulated).
app.orders.processing-delay=3s
