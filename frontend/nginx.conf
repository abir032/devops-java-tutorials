# Docker's embedded DNS; re-resolve the name "backend" every 10 s.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Static React app (fall back to index.html for client-side routes).
    location / {
        try_files $uri /index.html;
    }

    # API: forwarded to the backend container over web-net.
    # A variable in proxy_pass makes nginx resolve the name at request time,
    # so nginx still starts if the backend is not up yet.
    location /api/ {
        set $upstream http://backend:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
